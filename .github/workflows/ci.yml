name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --cov=experiment --cov-fail-under=80
      - name: Render benchmark figures
        run: |
          python plot_results.py --output-dir artifacts/ci-figures
          test -s artifacts/ci-figures/f1-by-split.png
          test -s artifacts/ci-figures/seed-42-tradeoff.png
